<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8bcc6"/>
      <stop offset="100%" stop-color="#7a808d"/>
    </linearGradient>
  </defs>

  <!-- caliper (static) -->
  <path d="M58 20 L72 20 L74 44 L58 44 Z" fill="#ff6b00" opacity="0.75"/>
  <rect x="56" y="52" width="18" height="8" rx="2" fill="#ff6b00" opacity="0.6"/>

  <!-- spinning disc -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 48 48" to="360 48 48" dur="3s" repeatCount="indefinite"/>
    <circle cx="48" cy="48" r="36" stroke="url(#discGrad)" stroke-width="5" fill="none" opacity="0.9"/>
    <circle cx="48" cy="48" r="26" stroke="#9ca3b0" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="4 6"/>
    <circle cx="48" cy="48" r="10" fill="#ff6b00" opacity="0.75"/>
    <line x1="48" y1="12" x2="48" y2="24" stroke="#ffb347" stroke-width="3" opacity="0.7"/>
    <line x1="48" y1="72" x2="48" y2="84" stroke="#ffb347" stroke-width="3" opacity="0.7"/>
    <line x1="12" y1="48" x2="24" y2="48" stroke="#ffb347" stroke-width="3" opacity="0.7"/>
    <line x1="72" y1="48" x2="84" y2="48" stroke="#ffb347" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
