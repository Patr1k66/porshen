<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 96" fill="none">
  <rect x="16" y="4" width="16" height="8" rx="1" fill="#ff6b00" opacity="0.9"/>
  <rect x="18" y="12" width="12" height="6" fill="#9ca3b0" opacity="0.8"/>
  <rect x="20" y="18" width="8" height="24" rx="1" fill="#9ca3b0" opacity="0.85"/>
  <path d="M20 42 L24 50 L28 42 L26 58 L22 58 Z" fill="#ff6b00" opacity="0.8"/>
  <rect x="22" y="58" width="4" height="20" fill="#9ca3b0" opacity="0.7"/>
  <path d="M18 78 L30 78 L28 88 L20 88 Z" fill="#ff6b00" opacity="0.7"/>

  <!-- spark -->
  <g transform="translate(24, 42)">
    <path d="M0 -8 L2 0 L8 0 L3 4 L5 12 L0 7 L-5 12 L-3 4 L-8 0 L-2 0 Z" fill="#ffb347" opacity="0">
      <animate attributeName="opacity" values="0;1;0.2;1;0" dur="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.6;1.2;0.8;1.1;0.6" dur="0.8s" repeatCount="indefinite" additive="sum"/>
    </path>
    <circle r="3" fill="#fff" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- electrical pulse -->
  <line x1="24" y1="4" x2="24" y2="12" stroke="#ffb347" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
</svg>
