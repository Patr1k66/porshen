<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" fill="none">
  <defs>
    <linearGradient id="pistonMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4cad4"/>
      <stop offset="100%" stop-color="#8a919e"/>
    </linearGradient>
    <linearGradient id="pistonOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
  </defs>

  <!-- cylinder block -->
  <rect x="16" y="8" width="32" height="72" rx="4" fill="#1a1d27" stroke="#9ca3b0" stroke-width="1.5" opacity="0.9"/>
  <rect x="20" y="12" width="24" height="64" rx="2" fill="url(#pistonMetal)" opacity="0.35"/>

  <!-- moving piston assembly -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-16; 0,0" dur="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0; 0.5; 1"/>
    <rect x="18" y="20" width="28" height="10" rx="2" fill="url(#pistonOrange)"/>
    <rect x="14" y="30" width="36" height="6" rx="1" fill="url(#pistonOrange)" opacity="0.85"/>
    <rect x="22" y="36" width="20" height="28" rx="2" fill="url(#pistonMetal)"/>
    <line x1="32" y1="40" x2="32" y2="60" stroke="#ff6b00" stroke-width="1.5" opacity="0.6"/>
    <rect x="20" y="64" width="24" height="8" rx="2" fill="#6b7280" opacity="0.8"/>
  </g>

  <!-- crank hint -->
  <circle cx="32" cy="84" r="6" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 32 84" to="360 32 84" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <line x1="32" y1="84" x2="38" y2="84" stroke="#ffb347" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 32 84" to="360 32 84" dur="0.9s" repeatCount="indefinite"/>
  </line>
</svg>
